name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # lerna finds the last release with `git describe`, which takes the
      # nearest tag of ANY name. A tag like `v1` on main makes the next
      # release skip packages that changed (it happened at 0.4.0). The
      # Action's `v1` is a branch for that reason.
      - name: Only lerna release tags (name@version) on main
        run: |
          bad=$(git tag --merged HEAD | grep -v '@[0-9]' || true)
          if [ -n "$bad" ]; then echo "::error::tags lerna would mistake for a release: $bad"; exit 1; fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run policy:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist
          retention-days: 1

  # Build every example with the CLI and fail unless final PDFs are byte-identical.
  examples:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # per-file commit dates drive SOURCE_DATE_EPOCH

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages

      - run: node packages/latex-kit/dist/cli.js doctor

      - name: Render the plain .tex example
        run: node packages/latex-kit/dist/cli.js render examples/letter/letter.tex --verify

      - name: PSTricks and TikZ arrows (latex → dvips → ps2pdf, picked by engine auto)
        run: node packages/latex-kit/dist/cli.js render examples/graphics/arrows.tex --verify

      - name: Check the example project
        working-directory: examples/workspace
        run: node ../../packages/latex-kit/dist/cli.js check

      - name: Generated schemas and types are up to date
        working-directory: examples/workspace
        run: |
          node ../../packages/latex-kit/dist/cli.js typegen
          git diff --exit-code -- templates

      - name: Build final (twice, byte-identical), draft and blank
        working-directory: examples/workspace
        run: |
          node ../../packages/latex-kit/dist/cli.js lock --check
          node ../../packages/latex-kit/dist/cli.js build --final --verify
          node ../../packages/latex-kit/dist/cli.js build
          node ../../packages/latex-kit/dist/cli.js build --variant blank

      - name: Blank styles, review copies, and the positions of the spots to sign
        working-directory: examples/workspace
        run: |
          node ../../packages/latex-kit/dist/cli.js build --variant blank --blanks names
          node ../../packages/latex-kit/dist/cli.js build --variant blank --blanks lines
          node ../../packages/latex-kit/dist/cli.js build --highlight --missing blank
          test -f out/nda/nda-names.pdf
          test -f out/nda-placeholder-labs/nda-placeholder-labs-highlight.pdf
          # the NDA's two \signature blocks mark a signature and a date each
          node -e "const f=require('./out/nda-placeholder-labs/nda-placeholder-labs.form.json'); const got=f.map(x=>x.type+':'+x.who).sort().join(); const want='date:discloser,date:recipient,signature:discloser,signature:recipient'; if(got!==want){console.error('got',got);process.exit(1)}"

      - name: An unchanged build reuses its PDF
        working-directory: examples/workspace
        run: |
          node ../../packages/latex-kit/dist/cli.js build --final | tee build.log
          test "$(grep -c unchanged build.log)" -eq 3

      - name: Signed (fictional signature images made here, outside the repo) and another locale
        working-directory: examples/workspace
        run: |
          sigs="$RUNNER_TEMP/signatures"
          mkdir -p "$sigs"
          python3 - "$sigs" <<'PY'
          import math, struct, sys, zlib
          for i, name in enumerate(['avery-example', 'jordan-rivera']):
              w, h = 360, 90
              px = [[255] * w for _ in range(h)]
              for t in range(3000):
                  x = 10 + t * (w - 20) / 3000
                  y = h / 2 + 22 * math.sin(t / (97 + i * 7)) * math.cos(t / (38 + i)) + 8 * math.sin(t / 15)
                  for dx in (-1, 0, 1):
                      for dy in (-1, 0, 1):
                          if 0 <= int(x) + dx < w and 0 <= int(y) + dy < h: px[int(y) + dy][int(x) + dx] = 20
              raw = b''.join(b'\x00' + bytes(r) for r in px)
              chunk = lambda t, d: struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              open(f'{sys.argv[1]}/{name}.png', 'wb').write(b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 0, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b''))
          PY
          node ../../packages/latex-kit/dist/cli.js build --variant signed --only 'nda-*' --signatures "$sigs" --verify
          test ! -e out/nda-placeholder-labs/lk-signatures
          jq -e '.signatureImages == ["avery-example.png", "jordan-rivera.png"]' out/nda-placeholder-labs/nda-placeholder-labs-signed.manifest.json
          node ../../packages/latex-kit/dist/cli.js build --only letter-sample-kk --locale en-US
          test -s out/letter-sample-kk-en-US/letter-sample-kk-en-US-draft.pdf

      - name: Redline a changed document against HEAD
        working-directory: examples/workspace
        run: |
          sed -i 's/termMonths: 24/termMonths: 36/' documents/nda-placeholder-labs.yaml
          node ../../packages/latex-kit/dist/cli.js diff documents/nda-placeholder-labs.yaml --against HEAD
          git checkout -- documents
          ls out/nda-placeholder-labs/diff/*.pdf

      - name: Import a Word document into an empty project and build it
        run: |
          cli="$PWD/packages/latex-kit/dist/cli.js"
          docx="$PWD/examples/import/offer-letter.docx"
          mkdir -p imported && cd imported
          node "$cli" import "$docx"
          node "$cli" check
          node "$cli" build --variant blank
          test -s out/offer-letter/offer-letter-blank.pdf

      - name: A new project and a new paper build out of the box
        run: |
          cli="$PWD/packages/latex-kit/dist/cli.js"
          node "$cli" init scaffold
          (cd scaffold && node "$cli" check && node "$cli" lock --check && node "$cli" build --final --verify && node "$cli" build --variant blank)
          node "$cli" init paper-scaffold --paper
          (cd paper-scaffold && node "$cli" render paper/main.tex --verify)

      - uses: actions/upload-artifact@v4
        with:
          name: examples
          path: |
            out/*.pdf
            examples/workspace/out/**/*.pdf
            examples/workspace/out/**/*.manifest.json
            imported/out/**/*.pdf
            scaffold/out/**/*.pdf
            paper-scaffold/out/*.pdf
          if-no-files-found: error

  # Exercise the reusable action exactly as another repo would.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: letter
        uses: ./action
        with:
          file: examples/letter/letter.tex
          verify: 'true'
          artifact-name: action-letter

      - run: echo "built ${{ steps.letter.outputs.pdf }} (${{ steps.letter.outputs.sha256 }})"

      - id: auto
        uses: ./action
        with:
          file: examples/letter/letter.tex
          engine: auto
          verify: 'true'
          artifact-name: action-letter-auto

      - name: auto picked lualatex, so the bytes match
        run: test "${{ steps.auto.outputs.sha256 }}" = "${{ steps.letter.outputs.sha256 }}"
