name: Slim image

# Builds docker/slim (the full image minus rarely used TeX Live collections)
# for amd64 and arm64 as constructiveio/latex-kit:slim on Docker Hub, tags the
# full image it is cut from as :full, and fails unless every example builds
# to the same PDF bytes on both.

on:
  push:
    branches: [main]
    paths: ['docker/slim/**']
  workflow_dispatch: {}

concurrency:
  group: image-slim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  slim:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: constructiveio/latex-kit
          tags: |
            type=raw,value=slim
            type=raw,value=tl2026-slim
            type=sha,format=short,suffix=-slim

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/slim
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Tag the full image slim is cut from as :full
        run: |
          full=$(sed -n 's/^FROM \(constructiveio\/latex-kit@sha256:[0-9a-f]*\).*/\1/p' docker/slim/Dockerfile)
          test -n "$full"
          docker buildx imagetools create -t constructiveio/latex-kit:full -t constructiveio/latex-kit:tl2026-full "$full"
          echo "### constructiveio/latex-kit:slim" >> "$GITHUB_STEP_SUMMARY"
          echo "digest \`${{ steps.build.outputs.digest }}\`, cut from \`$full\`" >> "$GITHUB_STEP_SUMMARY"

  same-bytes:
    needs: slim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Every example gives the same PDF on full and slim
        run: |
          cli="$PWD/packages/latex-kit/dist/cli.js"
          slim="constructiveio/latex-kit@${{ needs.slim.outputs.digest }}"
          hashes() {
            (cd examples/workspace && rm -rf out \
              && node "$cli" build --final $1 && node "$cli" build $1 && node "$cli" build --variant blank $1 \
              && jq -r '"\(.pdf.file) \(.pdf.sha256)"' out/*/*.manifest.json)
            node "$cli" render examples/letter/letter.tex --json $1 | jq -r '"letter \(.sha256)"'
          }
          hashes "" > full.txt
          hashes "--image $slim" > slim.txt
          cat slim.txt
          diff full.txt slim.txt
